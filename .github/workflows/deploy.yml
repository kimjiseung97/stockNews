# .github/workflows/deploy.yml
# main → 프로덕션
#
# 기존 파일을 최소 변경한 버전. 바뀐 점:
#  - 이미지에 커밋 SHA 태그 추가 (롤백 가능)
#  - .env 에 IMAGE_TAG 주입 → compose.yml 에서 ${IMAGE_TAG} 참조
#  - git pull → fetch + reset --hard (브랜치 꼬임 방지)
#  - environment: production (Environment secrets / 승인 게이트)
#  - concurrency (연속 push 시 이전 배포 취소)
#  - 헬스체크 (컨테이너만 뜨고 앱이 죽은 상태를 잡음)
#  - 텔레그램 알림 활성화

name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/kimjiseung97/stocknews

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: main        # ← Environment secrets + 승인 게이트
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ github.sha }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          TOSS_CLIENT_ID: ${{ secrets.TOSS_CLIENT_ID }}
          TOSS_CLIENT_SECRET: ${{ secrets.TOSS_CLIENT_SECRET }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          DOMAIN: ${{ secrets.DOMAIN }}
          ADMIN_DOMAIN: ${{ secrets.ADMIN_DOMAIN }}
          SCHEDULER_ENABLED: "true"
          # 요청 제한 - 오탐으로 정상 사용자가 막히면 RATE_LIMIT_ENABLED를 false로 바꿔 재배포하면 꺼진다.
          RATE_LIMIT_ENABLED: "true"
          RATE_LIMIT_CAPACITY: "120"
          RATE_LIMIT_REFILL_PERIOD: "1m"
          # 앱 앞의 신뢰 프록시 수(Caddy 1대). 이 값이 틀리면 IP 판별이 통째로 어긋난다.
          RATE_LIMIT_TRUSTED_PROXY_COUNT: "1"
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 2222
          command_timeout: 40m
          envs: IMAGE_TAG,DB_HOST,DB_PORT,DB_NAME,DB_USERNAME,DB_PASSWORD,MAIL_HOST,MAIL_PORT,MAIL_USERNAME,MAIL_PASSWORD,MAIL_FROM_NAME,NAVER_CLIENT_ID,NAVER_CLIENT_SECRET,TOSS_CLIENT_ID,TOSS_CLIENT_SECRET,NVIDIA_API_KEY,FINNHUB_API_KEY,CORS_ALLOWED_ORIGINS,DOMAIN,ADMIN_DOMAIN,SCHEDULER_ENABLED,RATE_LIMIT_ENABLED,RATE_LIMIT_CAPACITY,RATE_LIMIT_REFILL_PERIOD,RATE_LIMIT_TRUSTED_PROXY_COUNT
          script: |
            set -e
            cd ~/stockNews

            # 브랜치를 명시적으로 맞춤 (git pull 은 체크아웃된 브랜치에 따라 결과가 달라짐)
            git fetch --prune origin
            git checkout -B main origin/main
            git reset --hard origin/main

            cat > .env <<EOF
            IMAGE_TAG=$IMAGE_TAG
            DB_HOST=$DB_HOST
            DB_PORT=$DB_PORT
            DB_NAME=$DB_NAME
            DB_USERNAME=$DB_USERNAME
            DB_PASSWORD=$DB_PASSWORD
            MAIL_HOST=$MAIL_HOST
            MAIL_PORT=$MAIL_PORT
            MAIL_USERNAME=$MAIL_USERNAME
            MAIL_PASSWORD=$MAIL_PASSWORD
            MAIL_FROM_NAME=$MAIL_FROM_NAME
            NAVER_CLIENT_ID=$NAVER_CLIENT_ID
            NAVER_CLIENT_SECRET=$NAVER_CLIENT_SECRET
            TOSS_CLIENT_ID=$TOSS_CLIENT_ID
            TOSS_CLIENT_SECRET=$TOSS_CLIENT_SECRET
            NVIDIA_API_KEY=$NVIDIA_API_KEY
            FINNHUB_API_KEY=$FINNHUB_API_KEY
            CORS_ALLOWED_ORIGINS=$CORS_ALLOWED_ORIGINS
            DOMAIN=$DOMAIN
            ADMIN_DOMAIN=$ADMIN_DOMAIN
            SCHEDULER_ENABLED=$SCHEDULER_ENABLED
            RATE_LIMIT_ENABLED=$RATE_LIMIT_ENABLED
            RATE_LIMIT_CAPACITY=$RATE_LIMIT_CAPACITY
            RATE_LIMIT_REFILL_PERIOD=$RATE_LIMIT_REFILL_PERIOD
            RATE_LIMIT_TRUSTED_PROXY_COUNT=$RATE_LIMIT_TRUSTED_PROXY_COUNT
            EOF

            # compose.yml 이 external 로 참조하는 망. 어느 프로젝트도 소유하지 않아야
            # (docker compose down 시 삭제되지 않아야) 하므로 여기서 멱등하게 만든다.
            docker network inspect edge >/dev/null 2>&1 || docker network create edge
            docker network inspect stocknews_internal >/dev/null 2>&1 || docker network create stocknews_internal

            # 벡터 DB는 rag 프로젝트 소유다. 이 앱은 더 이상 직접 붙지 않지만, 같은 망에 있는
            # embedding-service가 여기로 붙어 검색을 처리한다. rag 쪽을 재생성하면 연결이
            # 풀릴 수 있고 그러면 챗봇이 조용히 뉴스 근거를 잃으므로 배포 때마다 멱등하게 다시 붙인다.
            docker network connect --alias vector-db stocknews_internal rag-vector-db-1 2>/dev/null || true

            # ghcr에 저장된 자격증명이 만료되면 docker는 익명으로 폴백하지 않고 그대로 denied를 낸다.
            # 이 이미지는 public이라 로그인이 필요 없으므로, 서버에 남아있을 수 있는 오래된 자격증명을
            # 지우고 익명으로 받는다. (이미지를 private으로 돌리면 이 줄 대신 서버측 docker login이 필요하다.)
            docker logout ghcr.io || true

            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

            # 헬스체크 — 경로/포트는 프로젝트에 맞게 수정
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:8080/actuator/health > /dev/null 2>&1; then
                echo "healthy"; exit 0
              fi
              sleep 2
            done
            echo "::error::health check failed"
            docker compose logs --tail=80
            exit 1

