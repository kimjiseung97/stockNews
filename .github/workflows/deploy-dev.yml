# .github/workflows/deploy-dev.yml
# dev → GCP 개발망
#
# deploy.yml 과 구조는 같고 다음만 다름:
#  - 트리거: dev 브랜치
#  - 이미지 태그: :dev (prod 의 :latest 를 덮어쓰지 않음)
#  - environment: development (개발망 전용 secrets)
#  - SCHEDULER_ENABLED=false  ← 수집 배치 중복 방지 (필요하면 true 로)
#  - 승인 게이트 없음

name: Deploy (dev)

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/kimjiseung97/stocknews

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:dev
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ github.sha }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          TOSS_CLIENT_ID: ${{ secrets.TOSS_CLIENT_ID }}
          TOSS_CLIENT_SECRET: ${{ secrets.TOSS_CLIENT_SECRET }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          DOMAIN: ${{ secrets.DOMAIN }}
          SCHEDULER_ENABLED: "false"
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 40m
          envs: IMAGE_TAG,DB_HOST,DB_PORT,DB_NAME,DB_USERNAME,DB_PASSWORD,MAIL_HOST,MAIL_PORT,MAIL_USERNAME,MAIL_PASSWORD,MAIL_FROM_NAME,NAVER_CLIENT_ID,NAVER_CLIENT_SECRET,TOSS_CLIENT_ID,TOSS_CLIENT_SECRET,NVIDIA_API_KEY,FINNHUB_API_KEY,CORS_ALLOWED_ORIGINS,DOMAIN,SCHEDULER_ENABLED
          script: |
            set -e
            cd ~/stockNews

            git fetch --prune origin
            git checkout -B dev origin/dev
            git reset --hard origin/dev

            cat > .env <<EOF
            IMAGE_TAG=$IMAGE_TAG
            DB_HOST=$DB_HOST
            DB_PORT=$DB_PORT
            DB_NAME=$DB_NAME
            DB_USERNAME=$DB_USERNAME
            DB_PASSWORD=$DB_PASSWORD
            MAIL_HOST=$MAIL_HOST
            MAIL_PORT=$MAIL_PORT
            MAIL_USERNAME=$MAIL_USERNAME
            MAIL_PASSWORD=$MAIL_PASSWORD
            MAIL_FROM_NAME=$MAIL_FROM_NAME
            NAVER_CLIENT_ID=$NAVER_CLIENT_ID
            NAVER_CLIENT_SECRET=$NAVER_CLIENT_SECRET
            TOSS_CLIENT_ID=$TOSS_CLIENT_ID
            TOSS_CLIENT_SECRET=$TOSS_CLIENT_SECRET
            NVIDIA_API_KEY=$NVIDIA_API_KEY
            FINNHUB_API_KEY=$FINNHUB_API_KEY
            CORS_ALLOWED_ORIGINS=$CORS_ALLOWED_ORIGINS
            DOMAIN=$DOMAIN
            SCHEDULER_ENABLED=$SCHEDULER_ENABLED
            EOF

            # compose.yml 이 external 로 참조하는 망. 어느 프로젝트도 소유하지 않아야
            # (docker compose down 시 삭제되지 않아야) 하므로 여기서 멱등하게 만든다.
            docker network inspect edge >/dev/null 2>&1 || docker network create edge
            docker network inspect stocknews_internal >/dev/null 2>&1 || docker network create stocknews_internal

            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

            for i in $(seq 1 90); do
              if curl -fsS http://localhost:8080/actuator/health > /dev/null 2>&1; then
                echo "healthy"; exit 0
              fi
              sleep 2
            done
            echo "::error::health check failed"
            docker compose logs --tail=80
            exit 1
