server:
  servlet:
    session:
      timeout: 30m

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false

scheduler:
  enabled: ${SCHEDULER_ENABLED:true}

spring:
  application:
    name: stockNews

  datasource:
    url: jdbc:mariadb://${DB_HOST:jiseung-jiseungmysql.g.aivencloud.com}:${DB_PORT:14822}/${DB_NAME:stock}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:avnadmin}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  task:
    scheduling:
      pool:
        size: 3

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${MAIL_HOST:smtp.naver.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:dickseung23@naver.com}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 30000
          writetimeout: 30000

mail:
  from-name: ${MAIL_FROM_NAME:testMail}

sec:
  tickers-url: https://www.sec.gov/files/company_tickers.json
  user-agent: stockNews-dev anfajrdms@gmail.com

nasdaq:
  listed-url: https://www.nasdaqtrader.com/dynamic/SymDir/nasdaqlisted.txt
  other-listed-url: https://www.nasdaqtrader.com/dynamic/SymDir/otherlisted.txt

toss:
  base-url: https://openapi.tossinvest.com
  client-id: ${TOSS_CLIENT_ID}
  client-secret: ${TOSS_CLIENT_SECRET}

stock:
  seed:
    batch-size: 300
    cron: "0 */2 * * * *"
  theme-enrich:
    batch-size: 300
    cron: "0 */2 * * * *"
  korean-name-enrich:
    cron: "0 */2 * * * *"
  english-name-enrich:
    batch-size: 100
    cron: "0 */2 * * * *"
  # 미수집 종목(약 7,600건)을 빠르게 소진하려고 한시적으로 20 -> 100으로 올려둔 상태.
  # 종목당 네이버 API 2콜(reutersCode 조회 + 기업개요)이라 1회 실행이 30~50초 걸린다 - 2분 크론 안에는 끝난다.
  # 잔여 미수집이 거의 사라지면 20으로 되돌릴 것(그 이후엔 신규 상장분만 따라가면 되므로 20이면 충분하고,
  # 네이버에 없는 워런트/우선주/OTC를 계속 재시도하는 불필요한 호출을 줄일 수 있다).
  detail-enrich:
    batch-size: 100
    cron: "0 */2 * * * *"
  delist-check:
    cron: "0 0 4 * * *"
  batch-watchdog:
    cron: "0 */10 * * * *"
    stale-minutes: 30
  batch-history-cleanup:
    cron: "0 0 3 * * *"
    retention-days: 30
  news-collect:
    cron: "0 0 7 * * *"
    thread-pool-size: 8
  news-cleanup:
    cron: "0 30 7 * * *"
    retention-days: 7

news:
  dispatch:
    # 유저별 발송시간대(TB_USER_MAIL_DISPATCH_SETTING, 30분 단위)와 정확히 일치하는지 매번 검사하므로
    # 30분마다 돌아야 한다.
    cron: "0 0,30 * * * *"
    thread-pool-size: 8
    max-articles-per-stock: 1

verification:
  cleanup:
    cron: "0 0 * * * *"

finnhub:
  base-url: ${FINNHUB_BASE_URL:https://finnhub.io}
  api-key: ${FINNHUB_API_KEY:}
  lookback-days: 3
  cache-ttl-minutes: 60
  max-articles-per-ticker: 1

naver:
  news:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}
    max-articles-per-query: 5
    cache-ttl-minutes: 60

nvidia:
  api:
    base-url: https://integrate.api.nvidia.com/v1
    key: ${NVIDIA_API_KEY}
    model: openai/gpt-oss-20b
    fallback-models: z-ai/glm-5.3-flash,mistralai/mistral-nemotron
    max-tokens: 1024
    top-p: 0.95
    connect-timeout-ms: 10000
    read-timeout-ms: 120000

# 어드민(TB_PROMPT)에 등록된 LLM 프롬프트를 다시 읽기까지의 캐시 시간. 어드민 수정은 최대 이 시간 뒤에 반영된다.
prompt:
  cache-ttl-seconds: 60

auth:
  verification:
    code-length: 6
    expiry-minutes: 10
    max-requests: 3
    max-attempts: 3

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
