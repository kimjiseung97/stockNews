server:
  servlet:
    session:
      timeout: 30m

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false

scheduler:
  enabled: ${SCHEDULER_ENABLED:true}

spring:
  datasource:
    url: jdbc:mariadb://${DB_HOST:jiseung-jiseungmysql.g.aivencloud.com}:${DB_PORT:14822}/${DB_NAME:stock}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:avnadmin}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      # 뉴스 발송 배치는 워커 스레드(news.dispatch.thread-pool-size, 기본 8)마다 청크 트랜잭션 커넥션을 잡은 채
      # 발송 로그용 REQUIRES_NEW 커넥션을 하나 더 요구한다. 기본값 10이면 모든 워커가 두 번째 커넥션을
      # 서로 기다리다 멈출 수 있어 워커 수의 2배 + 여유만큼 잡는다.
      maximum-pool-size: ${DB_POOL_SIZE:20}

  task:
    scheduling:
      pool:
        size: 3

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${MAIL_HOST:smtp.naver.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:dickseung23@naver.com}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 30000
          writetimeout: 30000

mail:
  from-name: ${MAIL_FROM_NAME:testMail}

sec:
  tickers-url: https://www.sec.gov/files/company_tickers.json
  user-agent: stockNews-dev anfajrdms@gmail.com

nasdaq:
  listed-url: https://www.nasdaqtrader.com/dynamic/SymDir/nasdaqlisted.txt
  other-listed-url: https://www.nasdaqtrader.com/dynamic/SymDir/otherlisted.txt

toss:
  base-url: https://openapi.tossinvest.com
  client-id: ${TOSS_CLIENT_ID}
  client-secret: ${TOSS_CLIENT_SECRET}

stock:
  seed:
    batch-size: 300
    cron: "0 */2 * * * *"
  theme-enrich:
    batch-size: 300
    cron: "0 */2 * * * *"
  korean-name-enrich:
    cron: "0 */2 * * * *"
  english-name-enrich:
    batch-size: 100
    cron: "0 */2 * * * *"
  # 미수집 종목(약 7,600건)을 빠르게 소진하려고 한시적으로 20 -> 100으로 올려둔 상태.
  # 종목당 네이버 API 2콜(reutersCode 조회 + 기업개요)이라 1회 실행이 30~50초 걸린다 - 2분 크론 안에는 끝난다.
  # 잔여 미수집이 거의 사라지면 20으로 되돌릴 것(그 이후엔 신규 상장분만 따라가면 되므로 20이면 충분하고,
  # 네이버에 없는 워런트/우선주/OTC를 계속 재시도하는 불필요한 호출을 줄일 수 있다).
  detail-enrich:
    batch-size: 100
    cron: "0 */2 * * * *"
  delist-check:
    cron: "0 0 4 * * *"
  batch-watchdog:
    cron: "0 */10 * * * *"
    stale-minutes: 30
  batch-history-cleanup:
    cron: "0 0 3 * * *"
    retention-days: 30
  news-collect:
    cron: "0 0 7 * * *"
    thread-pool-size: 8
  news-cleanup:
    cron: "0 30 7 * * *"
    retention-days: 7

news:
  # TB_STOCK_NEWS 미임베딩 건을 임베딩 서비스로 넘기는 배치.
  # 뉴스 수집(형제 Node 프로젝트)이 돌고 난 뒤 쌓인 만큼 따라가면 되므로 10분 주기면 충분하다.
  embedding:
    cron: "0 */10 * * * *"
    # 임베딩 서비스 주소. 배포에서는 stocknews_internal 망의 컨테이너 alias를 쓴다
    # (무인증 API라 외부로 노출된 주소를 넣지 말 것).
    base-url: ${EMBEDDING_BASE_URL:http://embedding:8000}
    # 한 요청에 담는 뉴스 건수. 서비스 상한은 50이지만, 실패 시 묶음 전체를 다시 보내야 해서 작게 잡는다.
    batch-size: 10
    # 한 번 트리거될 때 처리할 최대 묶음 수. 밀린 건이 많아도 한 실행이 무한정 길어지지 않게 하는 상한.
    max-batches-per-run: 20
    connect-timeout-ms: 5000
    # CPU 추론이라 10건 묶음이 수십 초 걸릴 수 있다. 짧으면 서비스는 처리했는데 호출 측만 실패로 보고
    # 같은 묶음을 계속 재전송하게 된다.
    read-timeout-ms: 180000

  # 챗봇이 질문과 의미가 가까운 뉴스를 찾는 검색. 임베딩과 pgvector 조회는 파이썬
  # embedding-service가 하고, 이 앱은 질문 문장을 넘기고 기사 목록을 받는다.
  vector-search:
    # 적재(위 embedding 배치)와 같은 서비스다. 무인증 API라 내부망 주소를 쓸 것.
    base-url: ${EMBEDDING_BASE_URL:http://embedding:8000}
    # 프롬프트에 넣을 뉴스 기사 건수. 늘리면 근거는 늘지만 LLM 토큰과 응답 지연이 함께 늘어난다.
    article-limit: 3
    # 사용자가 화면 앞에서 기다리는 경로라 적재 배치(3분)와 달리 짧게 잡는다.
    # 늦으면 뉴스 근거를 포기하고 답변을 진행하는 편이 낫다.
    connect-timeout-ms: 2000
    read-timeout-ms: 5000

  dispatch:
    # 유저별 발송시간대(TB_USER_MAIL_DISPATCH_SETTING, 30분 단위)와 정확히 일치하는지 매번 검사하므로
    # 30분마다 돌아야 한다.
    cron: "0 0,30 * * * *"
    thread-pool-size: 8
    max-articles-per-stock: 1

verification:
  cleanup:
    cron: "0 0 * * * *"

finnhub:
  base-url: ${FINNHUB_BASE_URL:https://finnhub.io}
  api-key: ${FINNHUB_API_KEY:}
  lookback-days: 3
  cache-ttl-minutes: 60
  max-articles-per-ticker: 1

naver:
  news:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}
    max-articles-per-query: 5
    cache-ttl-minutes: 60

llm:
  # 챗봇 LLM 제공자 - LlmClient 구현체를 고르는 스위치. 지금은 nvidia 하나다.
  # 새 제공자를 붙일 때 구현체에 @ConditionalOnProperty(havingValue = "<이름>")을 달고 이 값을 바꾸면
  # 서비스 코드 수정 없이 교체된다. 키가 없으면 nvidia. 주의: 빈 문자열은 '없음'이 아니라 어떤 구현체에도
  # 맞지 않아 LlmClient 빈이 0개가 되고 기동이 실패한다 - 배포 스크립트가 빈 시크릿을 nvidia로 채운다.
  provider: ${LLM_PROVIDER:nvidia}

# llm.provider=anthropic 일 때 ClaudeChatClient가 읽는 설정. 키는 GitHub Actions 시크릿 -> .env로만 들어온다.
anthropic:
  api:
    key: ${ANTHROPIC_API_KEY:}
    # 기본 claude-opus-5. 비용을 낮추려면 claude-sonnet-5 / claude-haiku-4-5로 env만 바꾼다.
    model: ${ANTHROPIC_MODEL:claude-opus-5}
    max-tokens: 1024
    # 추론 깊이(low/medium/high/xhigh/max). 뉴스 근거 요약에는 low로 충분하고 응답이 빠르다.
    effort: ${ANTHROPIC_EFFORT:low}
    timeout-ms: 60000
    # SDK 재시도는 Retry-After를 따라 대기하므로 동기 챗봇 경로에서는 끈다(총 대기가 timeout을 넘김).
    max-retries: 0

# llm.provider=openai 일 때 GptClient가 읽는 설정.
openai:
  api:
    key: ${OPENAI_API_KEY:}
    base-url: https://api.openai.com/v1
    # 저비용·저지연 기본값. GPT-5 계열은 max_tokens/temperature/top_p를 받지 않으므로 GptClient가 보내지 않는다.
    model: ${OPENAI_MODEL:gpt-5-mini}
    max-completion-tokens: 1024
    # none/minimal/low/medium/high/xhigh/max 중 모델이 지원하는 값. gpt-5-mini에서 minimal 지원 여부는 미확정이라 low.
    reasoning-effort: ${OPENAI_REASONING_EFFORT:low}
    connect-timeout-ms: 10000
    read-timeout-ms: 60000

nvidia:
  api:
    base-url: https://integrate.api.nvidia.com/v1
    key: ${NVIDIA_API_KEY}
    # 기본 모델은 추론(thinking)을 하지 않는 mistral-nemotron(2026-09-22). 운영 로그 실측:
    #   - gpt-oss-20b(reasoning_effort=low): 7건 중 10초 미만 0건, 60초 초과 4건, 2건은 read-timeout(120초) 실패
    #   - glm-5.3-flash(파라미터 없음): 94초 뒤 content=null(finish_reason=length) - 이 모델은 reasoning_effort
    #     기본값이 max라 max_tokens를 전부 생각에 써버렸다
    # 타임아웃은 폴백 대상이 아니라 그대로 실패로 떨어지므로 느린 모델이 앞에 있으면 사용자가 2분을
    # 기다린 뒤 실패를 본다. 공식 문서상 mistral-nemotron은 "not a reasoning or thinking model"이고
    # 한국어(KMMLU) 벤치마크가 있다. 추론 모델 둘은 폴백으로 내리고 둘 다 reasoning_effort=low를 받는다.
    model: mistralai/mistral-nemotron
    fallback-models: openai/gpt-oss-20b,z-ai/glm-5.3-flash
    max-tokens: 1024
    top-p: 0.95
    connect-timeout-ms: 10000
    read-timeout-ms: 120000
    # 답을 내기 전에 태우는 추론 토큰 분량(low/medium/high). gpt-oss 계열 전용 파라미터다.
    # 안 보내면 모델 기본값으로 길게 추론한다 - 실측에서 답변 하나가 41초였고 그 대부분이 추론이었다.
    # 비우면 파라미터를 보내지 않아 예전 동작으로 돌아간다(재배포 없이 끌 수 있게 env로 뺐다).
    reasoning-effort: ${NVIDIA_REASONING_EFFORT:low}
    # reasoning-effort를 실어 보낼 모델. 모르는 파라미터를 400으로 거절하는 모델이 있고 400은
    # 폴백 대상이 아니라 그대로 실패하므로, 지원이 확인된 모델만 적는다.
    #   - gpt-oss-20b: NVIDIA API 레퍼런스에 top-level 파라미터로 명시(low/medium/high, 기본 medium)
    #   - glm-5.3-flash: 문서상 "thinking budget is controlled by reasoning_effort"(low/high/max, 기본 max).
    #     안 보내면 max로 돌아 답변 없이 토큰을 소진하므로 보낸다. top-level 위치가 문서에 명시되진 않았고,
    #     마지막 폴백이라 거절돼도 잃는 건 이 모델 하나다.
    reasoning-effort-models: openai/gpt-oss-20b,z-ai/glm-5.3-flash

# 어드민(TB_PROMPT)에 등록된 LLM 프롬프트를 다시 읽기까지의 캐시 시간. 어드민 수정은 최대 이 시간 뒤에 반영된다.
prompt:
  cache-ttl-seconds: 60

auth:
  verification:
    code-length: 6
    expiry-minutes: 10
    max-requests: 3
    max-attempts: 3

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# IP 단위 API 요청 제한. 대상 경로는 WebConfig의 RateLimitInterceptor 등록부 참고.
rate-limit:
  # 오탐으로 정상 사용자가 막히면 재배포 없이 끌 수 있어야 한다.
  enabled: ${RATE_LIMIT_ENABLED:true}
  # refill-period 동안 IP 하나가 쓸 수 있는 요청 수. 화면 하나가 API를 여러 번 부르는 걸 감안한 값이라,
  # 실제 트래픽 로그(rate limit exceeded 경고 빈도)를 보고 조정할 것.
  capacity: ${RATE_LIMIT_CAPACITY:120}
  refill-period: ${RATE_LIMIT_REFILL_PERIOD:1m}
  # 동시에 추적할 IP 수 상한 - 없으면 IP를 바꿔가며 쏘는 것만으로 힙이 계속 늘어난다.
  max-tracked-clients: ${RATE_LIMIT_MAX_TRACKED_CLIENTS:100000}
  client-idle-timeout: ${RATE_LIMIT_CLIENT_IDLE_TIMEOUT:10m}
  # 앱 앞에 있는 신뢰 프록시 수. 이 구성은 Caddy 한 대라 1.
  # X-Forwarded-For를 뒤에서 몇 번째까지 믿을지를 정한다(앞에서 세면 클라이언트가 위조 가능 - ClientIpResolver 참고).
  # Caddy를 거치지 않고 edge 네트워크로 직접 들어오는 경로가 생기면 이 값이 무의미해지므로,
  # 앱 포트를 프록시 외에는 열어두지 말 것.
  trusted-proxy-count: ${RATE_LIMIT_TRUSTED_PROXY_COUNT:1}
  # 거절 로그 분당 상한 - 공격 트래픽이 로그 로테이션으로 다른 로그를 밀어내지 못하게 한다.
  log-lines-per-minute: ${RATE_LIMIT_LOG_LINES_PER_MINUTE:20}
