spring:
  application:
    name: stockNews

  datasource:
    url: jdbc:mysql://${DB_HOST:jiseung-jiseungmysql.g.aivencloud.com}:${DB_PORT:14822}/${DB_NAME:stock}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&sslMode=REQUIRED
    username: ${DB_USERNAME:avnadmin}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  task:
    scheduling:
      pool:
        size: 3

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${MAIL_HOST:smtp.naver.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:dickseung23@naver.com}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

mail:
  from-name: ${MAIL_FROM_NAME:testMail}

sec:
  tickers-url: https://www.sec.gov/files/company_tickers.json
  user-agent: stockNews-dev anfajrdms@gmail.com

stock:
  seed:
    batch-size: 300
    cron: "0 */2 * * * *"
  theme-enrich:
    batch-size: 300
    cron: "0 */2 * * * *"
  korean-name-enrich:
    batch-size: 100
    cron: "0 */2 * * * *"
  detail-enrich:
    batch-size: 20
    cron: "0 */2 * * * *"

news:
  dispatch:
    cron: "0 0 9 * * *"
    thread-pool-size: 8

verification:
  cleanup:
    cron: "0 0 * * * *"

finnhub:
  base-url: ${FINNHUB_BASE_URL:https://finnhub.io}
  api-key: ${FINNHUB_API_KEY:}
  lookback-days: 3
  cache-ttl-minutes: 60
  max-articles-per-ticker: 1

naver:
  news:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}
    max-articles-per-query: 1
    cache-ttl-minutes: 60

auth:
  verification:
    code-length: 6
    expiry-minutes: 10
    max-requests: 3
    max-attempts: 3

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
