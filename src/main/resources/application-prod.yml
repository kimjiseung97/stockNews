server:
  servlet:
    session:
      timeout: 30m

spring:
  application:
    name: stockNews

  datasource:
    url: jdbc:mariadb://${DB_HOST:jiseung-jiseungmysql.g.aivencloud.com}:${DB_PORT:14822}/${DB_NAME:stock}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:avnadmin}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  task:
    scheduling:
      pool:
        size: 3

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${MAIL_HOST:smtp.naver.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:dickseung23@naver.com}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

mail:
  from-name: ${MAIL_FROM_NAME:testMail}

sec:
  tickers-url: https://www.sec.gov/files/company_tickers.json
  user-agent: stockNews-dev anfajrdms@gmail.com

nasdaq:
  listed-url: https://www.nasdaqtrader.com/dynamic/SymDir/nasdaqlisted.txt
  other-listed-url: https://www.nasdaqtrader.com/dynamic/SymDir/otherlisted.txt

toss:
  base-url: https://openapi.tossinvest.com
  client-id: ${TOSS_CLIENT_ID}
  client-secret: ${TOSS_CLIENT_SECRET}

stock:
  seed:
    batch-size: 300
    cron: "0 */2 * * * *"
  theme-enrich:
    batch-size: 300
    cron: "0 */2 * * * *"
  korean-name-enrich:
    cron: "0 */2 * * * *"
  english-name-enrich:
    batch-size: 100
    cron: "0 */2 * * * *"
  detail-enrich:
    batch-size: 20
    cron: "0 */2 * * * *"
  delist-check:
    cron: "0 0 4 * * *"
  batch-watchdog:
    cron: "0 */10 * * * *"
    stale-minutes: 30
  batch-history-cleanup:
    cron: "0 0 3 * * *"
    retention-days: 30
  news-collect:
    cron: "0 0 7 * * *"
    thread-pool-size: 8
  news-cleanup:
    cron: "0 30 7 * * *"
    retention-days: 7

news:
  dispatch:
    # 유저별 발송시간대(TB_USER_MAIL_DISPATCH_SETTING, 30분 단위)와 정확히 일치하는지 매번 검사하므로
    # 30분마다 돌아야 한다.
    cron: "0 0,30 * * * *"
    thread-pool-size: 8
    max-articles-per-stock: 1

verification:
  cleanup:
    cron: "0 0 * * * *"

finnhub:
  base-url: ${FINNHUB_BASE_URL:https://finnhub.io}
  api-key: ${FINNHUB_API_KEY:}
  lookback-days: 3
  cache-ttl-minutes: 60
  max-articles-per-ticker: 1

naver:
  news:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}
    max-articles-per-query: 5
    cache-ttl-minutes: 60

nvidia:
  api:
    base-url: https://integrate.api.nvidia.com/v1
    key: ${NVIDIA_API_KEY}
    model: moonshotai/kimi-k3
    max-tokens: 1024

auth:
  verification:
    code-length: 6
    expiry-minutes: 10
    max-requests: 3
    max-attempts: 3

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
