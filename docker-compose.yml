x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: Asia/Seoul
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
    env_file:
      - .env
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      stocknews_internal:
        aliases: [db]

  app:
    image: ${IMAGE:-ghcr.io/kimjiseung97/stocknews}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Seoul
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      edge:
        aliases: [stocknews-app]
      stocknews_internal: {}

networks:
  edge:
    external: true
  stocknews_internal:
    external: true

volumes:
  db-data:
    external: true
    name: stocknews_db-data
