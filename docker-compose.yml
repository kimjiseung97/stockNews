x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    logging: *default-logging
    # 기본 innodb_buffer_pool_size는 128MB라, 종목 검색(TB_STOCK 전량 스캔 + TB_STOCK_DETAIL 조인)이
    # 사실상 OS 페이지 캐시에 기대고 있었다. RAG 스택(embedding-service 약 2.2GB, pgvector)이 올라온 뒤
    # 그 캐시가 밀려나면서 같은 쿼리가 디스크로 내려갔고, 디스크는 pgvector HNSW 쓰기와 경합해
    # /proc/pressure/io의 full이 avg300 35%까지 올라갔다(= 5분 중 1/3을 전체 정지).
    # 핫셋을 버퍼 풀에 상주시켜 페이지 캐시 경합과 무관하게 만든다.
    command: --innodb-buffer-pool-size=2G
    environment:
      TZ: Asia/Seoul
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
    env_file:
      - .env
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      stocknews_internal:
        aliases: [db]

  app:
    image: ${IMAGE:-ghcr.io/kimjiseung97/stocknews}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Seoul
      # 힙 상한. 기본값(컨테이너 메모리의 1/4)은 mem_limit이 줄면 같이 줄어 배치가 쪼들리므로
      # 명시한다. mem_limit과의 차이가 metaspace·스레드 스택·다이렉트 버퍼의 몫이다.
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xmx1200m}
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:8080"
    # 상한이 없으면 홈서버 OOM killer가 엉뚱한 컨테이너(MariaDB 등)를 죽일 수 있다.
    #
    # 이 값을 줄일 때는 cgroup 압박이 어떻게 나타나는지 알고 줄일 것. compose는 mem_limit만 걸고
    # memswap_limit은 안 걸어서, 한도에 닿으면 커널이 JVM 힙을 스왑으로 밀어낸다. 그러면 GC가
    # 힙을 훑을 때마다 디스크에서 되읽으며 서버 전체가 I/O 대기로 멈춘다(실제로 겪었다 -
    # 호스트에 7GB가 남았는데도 스왑에 1.5GB가 잡혔다).
    #
    # 예전에는 챗봇 질의 임베딩 모델(535MB ONNX)을 이 JVM에 올려서 2g도 3g도 모자랐다
    # (3g에서 99.94% 점유). 지금은 그 일을 파이썬 embedding-service가 하므로 -Xmx1200m에
    # 넉넉한 여유를 더한 2g로 충분하다.
    mem_limit: 2g
    depends_on:
      db:
        condition: service_healthy
    networks:
      edge:
        aliases: [stocknews-app]
      # 벡터 DB(rag 프로젝트의 pgvector)도 이 망에 vector-db 별칭으로 있어, 챗봇 검색이
      # 여기로 붙는다. 임베딩 서비스(embedding)도 같은 망이다.
      stocknews_internal: {}

networks:
  edge:
    external: true
  stocknews_internal:
    external: true

volumes:
  db-data:
    external: true
    name: stocknews_db-data
